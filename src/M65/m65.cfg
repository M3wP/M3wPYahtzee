FEATURES {
    STARTADDRESS: default = $0801;
}
SYMBOLS {
    __STACKSIZE__: type = weak, value = $0800; # 2k stack
    __HIMEM__:     type = weak, value = $D000;
}
MEMORY {
    ZP:       file = "", start = $0002,  size = $00FE,      define = yes;
    MAIN:     file = %O, define = yes, start = $07FF, size = __HIMEM__ - $07FF;
    # $E000-$FFF9 only - stops short of $FFFA-$FFFF (cpuNMI/cpuRESET/cpuIRQ
    # hardware vectors, poked directly by initROM/main - HIRAM is banked
    # out so those addresses are plain RAM, but the linker doesn't know
    # they're spoken for, so the region has to end before them by hand).
    HIMEM:    file = %O, define = yes, start = $E000, size = $1FFA;
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    CODE:     load = MAIN,     type = ro;
    HIVARS:   load = HIMEM,    type = bss;
}
FEATURES {
}
