# docker compose up -d      build (if needed) and run detached
# docker compose logs -f    follow server output
# docker compose down       stop and remove
services:
  yahtzee-server:
    build: .
    image: m3wp-yahtzee-server
    ports:
      - "7632:7632"
    restart: unless-stopped
    # Extra server args, e.g. max connections:
    # command: ["-m", "50"]
